name: Iris MLOps CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the tested image to GHCR (main/master only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iris-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DVC_NO_ANALYTICS: "1"
  MLFLOW_ENABLE_TELEMETRY: "false"
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-serving.lock
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Validate data and train through DVC
        run: |
          dvc repro --force
          python -c "import json, subprocess; assert not json.loads(subprocess.check_output(['dvc', 'status', '--json']))"
      - name: Run unit and integration tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85 --junitxml=test-results.xml
      - name: Preserve tested model and lineage
        uses: actions/upload-artifact@v4
        with:
          name: iris-model-${{ github.sha }}
          path: |
            models/iris/
            reports/
            dvc.lock
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-test-results-${{ github.sha }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn

  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: iris-model-${{ github.sha }}
          path: .
      - uses: docker/setup-buildx-action@v3
      - name: Build tested serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: iris-mlops:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image as a non-root, read-only service
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name iris-ci --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8000:8000 iris-mlops:ci
          trap 'docker logs iris-ci; docker rm -f iris-ci' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/readyz
          curl --fail --silent --show-error http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            --data '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}' > prediction.json
          python -c "import json; p=json.load(open('prediction.json')); assert p['species']=='setosa'; assert abs(sum(p['probabilities'].values())-1)<1e-6"
      - name: Authenticate to GHCR
        if: >-
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image)) &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image with an immutable commit tag
        if: >-
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image)) &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker tag iris-mlops:ci "$image"
          docker push "$image"
